services:
  tesla-readonly:
    build: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      TESLA_REFRESH_TOKEN: ${TESLA_REFRESH_TOKEN:-}
      TESLA_MOCK: ${TESLA_MOCK:-0}
      TESLA_POLL_SECONDS: ${TESLA_POLL_SECONDS:-120}
      TESLA_SSO_BASE_URL: ${TESLA_SSO_BASE_URL:-https://auth.tesla.com/}
      TESLA_OWNER_API_BASE: ${TESLA_OWNER_API_BASE:-https://owner-api.teslamotors.com/}
      DATA_DIR: /data
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - tesla-readonly-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  tesla-readonly-data:
